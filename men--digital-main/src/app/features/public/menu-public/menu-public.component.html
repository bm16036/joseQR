<div class="menu-container">

  <header class="menu-header">
    <h1>Menú</h1>
    <p>Empresa: {{ companyId }}</p>
  </header>

  <ng-container *ngIf="!isLoading(); else loading">
    <ng-container *ngIf="menu().length > 0; else emptyMenu">
      <article class="menu-card" *ngFor="let m of menu()">
        <header class="menu-section-header">
          <h2>{{ m.nombre }}</h2>
          <p class="menu-description" *ngIf="m.descripcion">{{ m.descripcion }}</p>
        </header>

        <div class="menu-categories">
          <section class="category-block" *ngFor="let category of m.categorias">
            <header class="category-header">
              <h3>{{ category.nombre }}</h3>
              <p class="category-description" *ngIf="category.descripcion">{{ category.descripcion }}</p>
            </header>

            <ng-container *ngIf="category.productos.length > 0; else emptyCategory">
              <div class="product-list">
                <article class="product-card" *ngFor="let product of category.productos">
                  <h4>{{ product.nombre }}</h4>
                  <p class="description" *ngIf="product.descripcion">{{ product.descripcion }}</p>
                  <p class="price" *ngIf="product.precio !== undefined">$ {{ product.precio }}</p>
                </article>
              </div>
            </ng-container>
          </section>
        </div>
      </article>
    </ng-container>
  </ng-container>

  <ng-template #loading>
    <p class="helper-text">Cargando menú...</p>
  </ng-template>

  <ng-template #emptyMenu>
    <p class="helper-text">No hay menús disponibles para esta empresa.</p>
  </ng-template>

  <ng-template #emptyCategory>
    <p class="helper-text">No hay productos en esta categoría.</p>
  </ng-template>

</div>
