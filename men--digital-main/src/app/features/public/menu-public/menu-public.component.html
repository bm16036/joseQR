<div class="menu-container">
  <header class="menu-header">
    <div>
      <p class="eyebrow">Menú público</p>
      <h1>{{ details()?.menu?.name || 'Menú' }}</h1>
      <p class="muted">Código: {{ menuId }}</p>
    </div>
  </header>

  <section *ngIf="isLoading()" class="info-card">
    <p>Cargando el menú...</p>
  </section>

  <section *ngIf="!isLoading() && error()" class="info-card error">
    <p>{{ error() }}</p>
  </section>

  <ng-container *ngIf="!isLoading() && !error()">
    <ng-container *ngIf="hasProducts(); else emptyState">
      <section class="category" *ngFor="let category of details()?.categories">
        <h2>{{ category.name }}</h2>

        <div class="product-list">
          <article class="product-card" *ngFor="let product of category.products">
            <div>
              <h3>{{ product.name }}</h3>
              <p class="description">{{ product.description || 'Sin descripción' }}</p>
            </div>
            <p class="price">$ {{ product.price | number:'1.2-2' }}</p>
          </article>
        </div>
      </section>
    </ng-container>

    <ng-template #emptyState>
      <section class="info-card">
        <p>No hay productos disponibles para este menú.</p>
      </section>
    </ng-template>
  </ng-container>
</div>
